<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - LRQA MW Testing Dashboard</title>
    
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .code-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        
        .code-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-section i {
            font-size: 3rem;
            color: #10b981;
        }
        
        .logo-section h2 {
            margin-top: 15px;
            color: #1f2937;
            font-weight: 700;
        }
        
        .logo-section p {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .code-info {
            background: #f0fdf4;
            border-left: 4px solid #10b981;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #166534;
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            font-size: 1.2rem;
            letter-spacing: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .btn-verify {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }
        
        .back-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
        }
        
        .alert-danger {
            background: #fee;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="code-container">
        <div class="code-card">
            <div class="logo-section">
                <i class="bi bi-check-circle"></i>
                <h2>Verify Code</h2>
                <p>Enter the 6-digit code sent to your email</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}
            
            <div class="code-info">
                <i class="bi bi-info-circle"></i> Check your email for the 6-digit verification code. Code will expire in 10 minutes.
            </div>
            
            <form method="POST" id="codeForm">
                <div class="mb-3">
                    <label for="code" class="form-label">Verification Code</label>
                    <input type="text" class="form-control" id="code" name="code" 
                           placeholder="000000" inputmode="numeric" pattern="[0-9]{6}" 
                           maxlength="6" required autofocus>
                    <small class="d-block text-muted mt-2">Enter the 6-digit code from your email</small>
                </div>
                
                <button type="submit" class="btn btn-verify">
                    <i class="bi bi-shield-check"></i> Verify Code
                </button>
            </form>
            
            <div class="back-link">
                <a href="/change-password">← Back</a> | <a href="/" style="margin-left: 10px;">Go to Dashboard →</a>
            </div>
        </div>
    </div>
    
    <script>
        // Only allow numbers
        document.getElementById('code').addEventListener('keypress', function(e) {
            if (!/[0-9]/.test(e.key)) {
                e.preventDefault();
            }
        });
        
        // Auto-submit when 6 digits are entered
        document.getElementById('code').addEventListener('input', function() {
            if (this.value.length === 6 && /^[0-9]{6}$/.test(this.value)) {
                // Optionally auto-submit after a short delay
                setTimeout(() => {
                    // Commented out auto-submit - let user click button
                    // document.getElementById('codeForm').submit();
                }, 500);
            }
        });
    </script>
</body>
</html>
