<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - LRQA MW Testing Dashboard</title>
    
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .reset-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        
        .reset-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-section i {
            font-size: 3rem;
            color: #7c3aed;
        }
        
        .logo-section h2 {
            margin-top: 15px;
            color: #1f2937;
            font-weight: 700;
        }
        
        .logo-section p {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        
        .btn-reset {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }
        
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            background: linear-gradient(135deg, #6d28d9 0%, #5b21b6 100%);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }
        
        .back-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
        }
        
        .alert-danger {
            background: #fee;
            color: #991b1b;
        }
        
        .password-requirements {
            background: #f3f4f6;
            border-left: 4px solid #7c3aed;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #374151;
            margin-bottom: 20px;
        }
        
        .requirement {
            display: flex;
            align-items: center;
            padding: 4px 0;
        }
        
        .requirement i {
            margin-right: 8px;
            width: 16px;
            color: #9ca3af;
        }
        
        .requirement.met i {
            color: #10b981;
        }
        
        .password-strength {
            margin-top: 8px;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .strength-weak {
            background: #fee;
            color: #991b1b;
        }
        
        .strength-medium {
            background: #fef3c7;
            color: #92400e;
        }
        
        .strength-strong {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="logo-section">
                <i class="bi bi-key"></i>
                <h2>Create New Password</h2>
                <p>Set a strong password to secure your account</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}
            
            <div class="password-requirements">
                <strong><i class="bi bi-shield-check"></i> Password Requirements:</strong>
                <div class="requirement">
                    <i class="bi bi-dash-circle"></i> At least 8 characters
                </div>
                <div class="requirement">
                    <i class="bi bi-dash-circle"></i> Different from current password
                </div>
            </div>
            
            <form method="POST" id="passwordForm">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="new_password" name="new_password" 
                               placeholder="Enter new password" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggleNewPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="passwordStrength" style="display: none;"></div>
                </div>
                
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                               placeholder="Confirm password" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="passwordMatch" style="margin-top: 8px;"></div>
                </div>
                
                <button type="submit" class="btn btn-reset">
                    <i class="bi bi-check-circle"></i> Update Password
                </button>
            </form>
            
            <div class="back-link">
                <a href="/change-password">← Back</a> | <a href="/" style="margin-left: 10px;">Go to Dashboard →</a>
            </div>
        </div>
    </div>
    
    <script>
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const passwordStrengthDiv = document.getElementById('passwordStrength');
        const passwordMatchDiv = document.getElementById('passwordMatch');
        
        // Password visibility toggle
        document.getElementById('toggleNewPassword').addEventListener('click', function() {
            togglePasswordVisibility('new_password', this);
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            togglePasswordVisibility('confirm_password', this);
        });
        
        function togglePasswordVisibility(fieldId, button) {
            const input = document.getElementById(fieldId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
        
        // Check password strength
        newPasswordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 'weak';
            let message = 'Weak password';
            
            if (password.length >= 8) {
                strength = 'strong';
                message = 'Strong password ✓';
            } else if (password.length >= 6) {
                strength = 'medium';
                message = 'Medium password';
            }
            
            passwordStrengthDiv.innerHTML = `<div class="password-strength strength-${strength}">${message}</div>`;
            passwordStrengthDiv.style.display = 'block';
            
            checkPasswordMatch();
        });
        
        // Check password match
        confirmPasswordInput.addEventListener('input', checkPasswordMatch);
        
        function checkPasswordMatch() {
            const newPwd = newPasswordInput.value;
            const confirmPwd = confirmPasswordInput.value;
            
            if (confirmPwd === '') {
                passwordMatchDiv.innerHTML = '';
                return;
            }
            
            if (newPwd === confirmPwd) {
                passwordMatchDiv.innerHTML = '<small style="color: #10b981;"><i class="bi bi-check-circle"></i> Passwords match</small>';
            } else {
                passwordMatchDiv.innerHTML = '<small style="color: #dc2626;"><i class="bi bi-x-circle"></i> Passwords do not match</small>';
            }
        }
    </script>
</body>
</html>
