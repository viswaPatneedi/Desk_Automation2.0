<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Screen - {{ device_ip }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .viewer-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        .screen-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            overflow: auto;
        }
        #device-screen {
            max-width: 100%;
            max-height: calc(100vh - 60px);
            display: none;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
        }
        .status-connected {
            background: #28a745;
        }
        .status-loading {
            background: #ffc107;
            color: #000;
        }
        .status-error {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="toolbar">
            <div>
                <strong><i class="bi bi-tv"></i> Device: {{ device_ip }}</strong>
                <span id="status-badge" class="status-badge status-loading ms-2">Loading...</span>
                <small class="ms-2" id="last-update"></small>
            </div>
            <div>
                <button class="btn btn-sm btn-outline-light me-2" onclick="manualRefresh()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
                <div class="form-check form-switch d-inline-block">
                    <input class="form-check-input" type="checkbox" id="auto-refresh-toggle" checked>
                    <label class="form-check-label" for="auto-refresh-toggle">Auto-refresh (5s)</label>
                </div>
                <button class="btn btn-sm btn-outline-danger ms-2" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Close
                </button>
            </div>
        </div>
        <div class="screen-container">
            <div class="loading" id="loading">
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Capturing device screen...</p>
            </div>
            <div class="loading" id="error-msg" style="display: none;">
                <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: #dc3545;"></i>
                <p class="mt-2">Unable to capture screenshot</p>
                <button class="btn btn-outline-light mt-2" onclick="manualRefresh()">Retry</button>
            </div>
            <img id="device-screen" alt="Device Screen">
        </div>
    </div>

    <script>
        const deviceIp = '{{ device_ip }}';
        let autoRefreshInterval = null;
        let isLoading = false;

        function updateStatus(status, message) {
            const badge = document.getElementById('status-badge');
            badge.className = 'status-badge status-' + status;
            badge.textContent = message;
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').textContent = 
                `Last update: ${now.toLocaleTimeString()}`;
        }

        async function captureScreen() {
            if (isLoading) return;
            
            isLoading = true;
            const img = document.getElementById('device-screen');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');
            
            updateStatus('loading', 'Capturing...');
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            img.style.display = 'none';

            try {
                const timestamp = new Date().getTime();
                const url = `/api/live_screenshot/${deviceIp}?t=${timestamp}`;
                
                // Create a new image to test loading
                const testImg = new Image();
                
                testImg.onload = function() {
                    img.src = testImg.src;
                    img.style.display = 'block';
                    loading.style.display = 'none';
                    updateStatus('connected', 'Connected');
                    updateTimestamp();
                    isLoading = false;
                };
                
                testImg.onerror = function() {
                    loading.style.display = 'none';
                    errorMsg.style.display = 'block';
                    updateStatus('error', 'Error');
                    isLoading = false;
                };
                
                testImg.src = url;
                
            } catch (error) {
                console.error('Capture error:', error);
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                updateStatus('error', 'Error');
                isLoading = false;
            }
        }

        function manualRefresh() {
            captureScreen();
        }

        function toggleAutoRefresh() {
            const toggle = document.getElementById('auto-refresh-toggle');
            
            if (toggle.checked) {
                if (!autoRefreshInterval) {
                    autoRefreshInterval = setInterval(captureScreen, 5000);
                }
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Initialize
        document.getElementById('auto-refresh-toggle').addEventListener('change', toggleAutoRefresh);
        
        // Initial capture
        captureScreen();
        
        // Start auto-refresh
        toggleAutoRefresh();
        
        // Cleanup on close
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
