<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiles Detection Results - XUMO-TV Testing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        :root {
            --primary-color: #6b7280;
            --secondary-color: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #6b7280;
            --dark-color: #1f2937;
            --darker-color: #111827;
            --light-grey: #9ca3af;
            --medium-grey: #6b7280;
            --dark-grey: #374151;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --card-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
        
        body { 
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            min-height: 100vh;
            padding: 0;
            color: #d1d5db;
        }
        
        .hero-section {
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            color: #e5e7eb;
            padding: 3rem 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid #6b7280;
        }
        
        .hero-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .hero-subtitle {
            font-size: 1rem;
            color: #d1d5db;
        }
        
        .dashboard-card {
            background: #1f2937;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #374151;
        }
        
        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-lg);
        }
        
        .card-header-custom {
            background: #4b5563;
            color: #f3f4f6;
            padding: 1.25rem 1.5rem;
            border: none;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .card-header-custom h5 {
            margin: 0;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .card-body-custom {
            padding: 1.5rem;
        }
        
        .filter-section {
            background: #1f2937;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
            border: 1px solid #374151;
        }
        
        .filter-section .form-label {
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 0.5rem;
        }
        
        .filter-section .form-select,
        .filter-section .form-control {
            border-radius: 8px;
            background: #374151;
            border: 1px solid #4b5563;
            color: #f3f4f6;
            padding: 0.625rem 1rem;
            transition: all 0.2s;
            height: auto;
        }
        
        .filter-section .form-select:focus,
        .filter-section .form-control:focus {
            border-color: #6b7280;
            background: #4b5563;
            color: #f3f4f6;
            box-shadow: 0 0 0 0.2rem rgba(107, 114, 128, 0.25);
        }
        
        .btn-filter {
            background: #4b5563;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            color: #f3f4f6;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-filter:hover {
            background: #6b7280;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(75, 85, 99, 0.4);
        }
        
        .btn-export {
            background: var(--success-color);
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-export:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        
        .status-perfect {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        
        .status-partial {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        
        .status-missing {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        
        .job-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f3f4f6;
            margin: 1rem 0 0.5rem 0;
        }
        
        .job-meta {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 1rem;
        }
        
        .table-modern {
            margin-bottom: 0;
        }
        
        .table-modern thead th {
            background: #374151;
            color: #f3f4f6;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding: 1rem;
            border: none;
        }
        
        .table-modern thead th:first-child {
            border-radius: 10px 0 0 0;
        }
        
        .table-modern thead th:last-child {
            border-radius: 0 10px 0 0;
        }
        
        .table-modern tbody td {
            padding: 1rem;
            border-bottom: 1px solid #374151;
            vertical-align: middle;
            color: #1f2937;
        }
        
        .table-modern tbody tr:hover {
            background: #374151;
        }
        
        .table-modern tbody tr:last-child td {
            border-bottom: none;
        }
        
        .table-modern tbody td strong {
            color: #111827;
        }
        
        .tiles-list {
            font-size: 0.875rem;
            line-height: 1.6;
            color: #1f2937;
        }
        
        .tiles-list .tile-item {
            display: inline-block;
            margin-right: 0.25rem;
        }
        
        .tiles-list .tile-item:after {
            content: ", ";
        }
        
        .tiles-list .tile-item:last-child:after {
            content: "";
        }
        
        .badge {
            color: white !important;
            font-weight: 600;
        }
        
        .badge-success {
            background: var(--success-color) !important;
            color: white !important;
        }
        
        .badge-secondary {
            background: #6b7280 !important;
            color: white !important;
        }
        
        .table-modern td {
            color: #1f2937 !important;
        }
        
        .table-modern strong {
            color: #111827 !important;
        }
        
        .alert-info {
            background: rgba(107, 114, 128, 0.15);
            border: 1px solid rgba(107, 114, 128, 0.3);
            border-radius: 8px;
            color: #d1d5db;
        }
        
        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container-fluid">
            <h2 class="hero-title">🔍 Tiles Detection Results - XUMO-TV</h2>
            <p class="hero-subtitle mb-0">Input tiles found/missing for each iteration</p>
        </div>
    </div>

    <div class="container-fluid" style="padding: 20px;">
        <div class="filter-section">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Select Job:</label>
                    <select id="jobSelect" class="form-select">
                        <option value="">All Jobs</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Select Device:</label>
                    <select id="deviceSelect" class="form-select">
                        <option value="">All Devices</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-filter mt-4 flex-grow-1" onclick="loadResults()">
                        <i class="bi bi-funnel"></i> Apply Filter
                    </button>
                    <button class="btn btn-export mt-4" onclick="downloadExcel()" title="Export to Excel">
                        <i class="bi bi-download"></i> Export
                    </button>
                </div>
            </div>
        </div>

        <div id="resultsContainer" class="dashboard-card">
            <div class="card-body-custom">
                <div class="text-center text-muted" style="padding: 40px;">
                    <p>Loading tiles detection results...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadResults() {
            const jobId = document.getElementById('jobSelect').value;
            const deviceIp = document.getElementById('deviceSelect').value;
            
            let url = '/api/tiles-results';
            const params = [];
            if (jobId) params.push(`job_ids=${jobId}`);
            if (deviceIp) params.push(`device_ips=${deviceIp}`);
            if (params.length) url += '?' + params.join('&');
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Populate filters
                if (data.available_jobs) {
                    const jobSelect = document.getElementById('jobSelect');
                    jobSelect.innerHTML = '<option value="">All Jobs</option>';
                    data.available_jobs.forEach(job => {
                        const option = document.createElement('option');
                        option.value = job.job_id;
                        option.textContent = `${job.job_id} (${job.device_name}) - ${job.iterations} iterations`;
                        jobSelect.appendChild(option);
                    });
                    jobSelect.value = jobId;
                }
                
                // Build results HTML
                let html = '';
                if (data.results_by_device && Object.keys(data.results_by_device).length > 0) {
                    for (const [deviceIp, deviceData] of Object.entries(data.results_by_device)) {
                        html += renderDeviceResults(deviceIp, deviceData);
                    }
                } else {
                    html = '<div class="alert alert-info"><i class="bi bi-info-circle"></i> No results found for selected filters</div>';
                }
                
                document.getElementById('resultsContainer').innerHTML = html;
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('resultsContainer').innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-circle"></i> Error loading results: ${error}</div>`;
            }
        }
        
        function renderDeviceResults(deviceIp, deviceData) {
            const jobs = deviceData.jobs;
            let html = `
                <div class="dashboard-card">
                    <div class="card-header-custom">
                        <i class="bi bi-phone"></i>
                        <h5>${deviceData.device_name} (${deviceIp})</h5>
                    </div>
                    <div class="card-body-custom">
            `;
            
            for (const [jobId, jobData] of Object.entries(jobs)) {
                html += `
                    <div class="job-title">[CLIPBOARD] Job: ${jobId}</div>
                    <div class="job-meta">
                        <strong>Iterations:</strong> ${jobData.iterations || 'N/A'} | <strong>Status:</strong> ${jobData.status}
                    </div>
                    <table class="table table-sm table-modern">
                        <thead>
                            <tr>
                                <th>Iteration</th>
                                <th>Tiles Found</th>
                                <th>Input Tiles</th>
                                <th>Missing Tiles</th>
                                <th>Logs Collected</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                if (jobData.per_iteration && jobData.per_iteration.length > 0) {
                    jobData.per_iteration.forEach(iter => {
                        const statusClass = iter.all_found ? 'status-perfect' : (iter.missing_tiles && iter.missing_tiles.length > 0 ? 'status-missing' : 'status-partial');
                        const icon = iter.all_found ? '✓' : (iter.missing_tiles && iter.missing_tiles.length > 0 ? '✗' : '⚠');
                        const tileCount = `${iter.found_count}/${iter.total_count}`;
                        const missingList = iter.missing_tiles && iter.missing_tiles.length > 0 
                            ? iter.missing_tiles.join(', ')
                            : '—';
                        const foundList = iter.found_tiles && iter.found_tiles.length > 0
                            ? iter.found_tiles.join(', ')
                            : 'None';
                        const logsCollected = iter.logs_collected ? '<span class="badge badge-success">Collected</span>' : '<span class="badge badge-secondary">Not Collected</span>';
                        
                        html += `
                            <tr>
                                <td><strong style="color: #111827;">ITR-${iter.iteration}</strong></td>
                                <td><span class="status-badge ${statusClass}">
                                    ${icon} ${tileCount}
                                </span></td>
                                <td><div class="tiles-list">${foundList}</div></td>
                                <td><div class="tiles-list">${missingList}</div></td>
                                <td style="color: #1f2937;">${logsCollected}</td>
                            </tr>
                        `;
                    });
                } else {
                    html += '<tr><td colspan="4" class="text-muted text-center">No data</td></tr>';
                }
                
                html += `
                        </tbody>
                    </table>
                `;
            }
            
            html += `
                    </div>
                </div>
            `;
            
            return html;
        }
        
        function downloadExcel() {
            const jobId = document.getElementById('jobSelect').value;
            const deviceIp = document.getElementById('deviceSelect').value;
            
            let url = '/download/tiles-results';
            const params = [];
            if (jobId) params.push(`job_ids=${jobId}`);
            if (deviceIp) params.push(`device_ips=${deviceIp}`);
            if (params.length) url += '?' + params.join('&');
            
            window.location.href = url;
        }
        
        // Load results on page load
        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
