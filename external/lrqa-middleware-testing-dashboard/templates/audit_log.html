<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit Log - Sequences</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: radial-gradient(circle at 10% 10%, rgba(14, 165, 233, 0.2), transparent 45%), #0b1220;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            color: #60a5fa;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .header p {
            color: #9ca3af;
            margin: 0;
            font-size: 0.95rem;
        }
        .navigation { margin-bottom: 20px; }
        .navigation a { color: #60a5fa; text-decoration: none; font-size: 0.9rem; }
        .navigation a:hover { text-decoration: underline; }

        .day-group { margin-bottom: 28px; }
        .day-header {
            color: #93c5fd;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 8px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .day-count {
            background: #1f2937;
            color: #9ca3af;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .entry-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-left: 4px solid #6b7280;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
        }
        .entry-card.action-create { border-left-color: #22c55e; }
        .entry-card.action-update { border-left-color: #3b82f6; }
        .entry-card.action-delete { border-left-color: #ef4444; }

        .entry-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
        }
        .action-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .action-badge.create { background: #064e3b; color: #6ee7b7; }
        .action-badge.update { background: #1e3a5f; color: #93c5fd; }
        .action-badge.delete { background: #7f1d1d; color: #fca5a5; }

        .entry-title { font-weight: 600; color: #e2e8f0; }
        .entry-meta { color: #9ca3af; font-size: 0.82rem; }
        .team-badge {
            background: #374151;
            color: #d1d5db;
            padding: 2px 9px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        .toggle-icon { color: #6b7280; }

        .entry-details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #374151;
            display: none;
            font-size: 0.85rem;
        }
        .entry-details.open { display: block; }

        .step-row {
            background: #0b1220;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }
        .step-row.status-added { border-left: 3px solid #22c55e; }
        .step-row.status-removed { border-left: 3px solid #ef4444; }
        .step-row.status-modified { border-left: 3px solid #f59e0b; }
        .step-row.status-unchanged { opacity: 0.55; }

        .step-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 7px;
            border-radius: 8px;
            margin-right: 6px;
        }
        .step-label.status-added { background: #064e3b; color: #6ee7b7; }
        .step-label.status-removed { background: #7f1d1d; color: #fca5a5; }
        .step-label.status-modified { background: #78350f; color: #fcd34d; }
        .step-label.status-unchanged { background: #374151; color: #9ca3af; }

        pre.param-block {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 4px;
            padding: 8px;
            font-size: 0.78rem;
            color: #cbd5e1;
            max-height: 220px;
            overflow: auto;
            margin: 4px 0 0 0;
        }
        .diff-cols { display: flex; gap: 10px; flex-wrap: wrap; }
        .diff-col { flex: 1; min-width: 220px; }
        .diff-col-label { font-size: 0.72rem; color: #9ca3af; margin-bottom: 2px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .loading { text-align: center; padding: 40px; color: #9ca3af; }
        .error {
            background: #7f1d1d; border: 1px solid #dc2626; color: #fecaca;
            padding: 12px; border-radius: 5px; margin-bottom: 20px;
        }
        select.form-select-sm-dark {
            background: #0b1220; color: #e2e8f0; border: 1px solid #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="/"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="header">
            <div>
                <h1><i class="bi bi-journal-text"></i> Sequence Audit Log</h1>
                <p>Create / edit / delete history for saved sequences{% if user.is_team_admin and not user.is_super_admin %} - {{ user.team_name }} team{% endif %}</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <label for="daysSelect" class="entry-meta mb-0">Range:</label>
                <select id="daysSelect" class="form-select form-select-sm select-sm-dark" style="width: auto;" onchange="loadAuditLog()">
                    <option value="7">Last 7 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365">Last 365 days</option>
                </select>
            </div>
        </div>

        <div id="content">
            <div class="loading"><i class="bi bi-hourglass-split"></i> Loading audit log...</div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatParams(params) {
            if (params === null || params === undefined) return '(none)';
            try { return JSON.stringify(params, null, 2); } catch (e) { return String(params); }
        }

        function renderStepDiff(steps) {
            if (!steps || steps.length === 0) {
                return '<div class="entry-meta">No method steps recorded.</div>';
            }
            return steps.map(step => {
                const status = step.status || 'unchanged';
                let body = '';
                if (status === 'added') {
                    body = `<pre class="param-block">${escapeHtml(formatParams(step.new_params))}</pre>`;
                } else if (status === 'removed') {
                    body = `<pre class="param-block">${escapeHtml(formatParams(step.old_params))}</pre>`;
                } else if (status === 'modified') {
                    body = `
                        <div class="diff-cols">
                            <div class="diff-col">
                                <div class="diff-col-label">BEFORE</div>
                                <pre class="param-block">${escapeHtml(formatParams(step.old_params))}</pre>
                            </div>
                            <div class="diff-col">
                                <div class="diff-col-label">AFTER</div>
                                <pre class="param-block">${escapeHtml(formatParams(step.new_params))}</pre>
                            </div>
                        </div>`;
                }
                return `
                    <div class="step-row status-${status}">
                        <span class="step-label status-${status}">${status}</span>
                        <strong>Step ${step.index + 1}: ${escapeHtml(step.method || 'unknown')}</strong>
                        ${status !== 'unchanged' ? body : ''}
                    </div>`;
            }).join('');
        }

        function renderFullSteps(queueData) {
            if (!queueData || queueData.length === 0) {
                return '<div class="entry-meta">No method steps recorded.</div>';
            }
            return queueData.map((step, idx) => `
                <div class="step-row">
                    <strong>Step ${idx + 1}: ${escapeHtml(step.method || step.name || 'unknown')}</strong>
                    ${step.description ? `<div class="entry-meta">${escapeHtml(step.description)}</div>` : ''}
                    <pre class="param-block">${escapeHtml(formatParams(step.params))}</pre>
                </div>
            `).join('');
        }

        function renderEntryDetails(entry) {
            if (entry.action_type === 'create') {
                return `<div class="entry-meta mb-2">Sequence created with ${entry.methods ? entry.methods.length : 0} step(s):</div>${renderFullSteps(entry.queue_data)}`;
            }
            if (entry.action_type === 'delete') {
                return `<div class="entry-meta mb-2">Deleted sequence consisted of ${entry.methods ? entry.methods.length : 0} step(s):</div>${renderFullSteps(entry.queue_data)}`;
            }
            // update
            let html = '';
            if (entry.name_changed) {
                html += `<div class="entry-meta mb-2"><strong>Name:</strong> "${escapeHtml(entry.old_name)}" &rarr; "${escapeHtml(entry.new_name)}"</div>`;
            }
            if (entry.description_changed) {
                html += `<div class="entry-meta mb-2"><strong>Description:</strong> "${escapeHtml(entry.old_description)}" &rarr; "${escapeHtml(entry.new_description)}"</div>`;
            }
            html += renderStepDiff(entry.step_diff);
            return html;
        }

        function renderEntry(entry, idx) {
            const time = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString() : '';
            return `
                <div class="entry-card action-${entry.action_type}">
                    <div class="entry-top" onclick="toggleEntry('${idx}')">
                        <div>
                            <span class="action-badge ${entry.action_type}">${entry.action_type}</span>
                            <span class="entry-title">${escapeHtml(entry.sequence_name)}</span>
                            ${entry.team_name ? `<span class="team-badge ms-2"><i class="bi bi-people-fill"></i> ${escapeHtml(entry.team_name)}</span>` : ''}
                        </div>
                        <div class="entry-meta">
                            <i class="bi bi-person-fill"></i> ${escapeHtml(entry.performed_by)}
                            &nbsp;|&nbsp; <i class="bi bi-clock"></i> ${time}
                            &nbsp;<i class="bi bi-chevron-down toggle-icon" id="chevron-${idx}"></i>
                        </div>
                    </div>
                    <div class="entry-details" id="details-${idx}">
                        ${renderEntryDetails(entry)}
                    </div>
                </div>`;
        }

        function toggleEntry(idx) {
            const details = document.getElementById(`details-${idx}`);
            const chevron = document.getElementById(`chevron-${idx}`);
            details.classList.toggle('open');
            chevron.classList.toggle('bi-chevron-down');
            chevron.classList.toggle('bi-chevron-up');
        }

        async function loadAuditLog() {
            const content = document.getElementById('content');
            const days = document.getElementById('daysSelect').value;
            content.innerHTML = '<div class="loading"><i class="bi bi-hourglass-split"></i> Loading audit log...</div>';

            try {
                const response = await fetch(`/api/admin/audit-log/sequences?days=${days}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    content.innerHTML = `<div class="error">Failed to load audit log: ${escapeHtml(data.error || response.statusText)}</div>`;
                    return;
                }

                if (!data.days || data.days.length === 0) {
                    content.innerHTML = '<div class="empty-state"><i class="bi bi-inbox" style="font-size: 2rem;"></i><p class="mt-2">No sequence changes recorded in this range.</p></div>';
                    return;
                }

                let globalIdx = 0;
                let html = '';
                data.days.forEach(day => {
                    html += `
                        <div class="day-group">
                            <div class="day-header">
                                <i class="bi bi-calendar3"></i> ${day.date}
                                <span class="day-count">${day.entries.length} change${day.entries.length === 1 ? '' : 's'}</span>
                            </div>
                            ${day.entries.map(entry => renderEntry(entry, globalIdx++)).join('')}
                        </div>`;
                });
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = `<div class="error">Error loading audit log: ${escapeHtml(e.message)}</div>`;
            }
        }

        loadAuditLog();
    </script>
</body>
</html>
