<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Job Queue | RDK-E Middleware QA Testing Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-custom navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <div class="d-flex flex-column">
                <a class="navbar-brand mb-0" href="/">
                    <i class="bi bi-cpu-fill"></i>
                    RDK-E Middleware QA Testing Tool
                </a>
                <span class="developer-credit" style="font-size: 0.75rem; color: #9ca3af; margin-left: 2rem;">
                    <i class="bi bi-code-slash"></i> Designed & Developed by <strong>VISWA</strong>
                </span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="/results" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-bar-chart-fill"></i> View Results
                </a>
                <div class="btn-group" role="group">
                    <a href="/services/system-commands" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-gear-fill"></i> Services
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-light dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="visually-hidden">Toggle Dropdown</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                        <li><a class="dropdown-item" href="/services/system-commands"><i class="bi bi-terminal"></i> System Command</a></li>
                    </ul>
                </div>
                <a href="/jobs" class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-clock-history"></i> JOBS Queue
                </a>
                <a href="/reboot-perf-results" class="btn btn-sm btn-outline-info">
                    <i class="bi bi-speedometer2"></i> Reboot Perf Results
                </a>
                <a href="/deepsleep-results" class="btn btn-sm btn-outline-success">
                    <i class="bi bi-moon-fill"></i> DeepSleep Results
                </a>
                <a href="/soft-hard-boot-results" class="btn btn-sm btn-outline-info">
                    <i class="bi bi-arrow-repeat"></i> Boot Results
                </a>
                <span class="text-white">
                    <i class="bi bi-person-circle"></i> {{ current_user.name }}
                </span>
                <a href="/logout" class="btn btn-sm btn-danger">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
                <span class="badge bg-success badge-status">
                    <i class="bi bi-check-circle-fill"></i> System Online
                </span>
            </div>
        </div>
    </nav>
    <div class="container pb-5">
        <div class="dashboard-card mb-4">
            <div class="card-header-custom">
                <i class="bi bi-list-task"></i>
                <h5>Execution Queue (Pending Jobs)</h5>
            </div>
            <div class="card-body-custom">
                <div id="jobsTable"></div>
            </div>
        </div>
    </div>
    <script>
        // Fetch and display jobs
        function fetchJobs() {
            fetch('/api/queue/status')
                .then(response => response.json())
                .then(data => {
                    const jobs = data.queued_jobs || [];
                    let html = '';
                    if (jobs.length === 0) {
                        html = '<div class="text-muted">No jobs are currently queued.</div>';
                    } else {
                        html = '<table class="table table-sm table-bordered"><thead><tr><th>Device</th><th>Method</th><th>Details</th><th>Iterations</th><th>Status</th><th>Queued At</th></tr></thead><tbody>';
                        const renderParams = (item) => {
                            const parts = [];
                            // Handle boot_type for soft_hard_boot
                            if (item.boot_type) {
                                const bootColor = item.boot_type === 'HARD' ? '#ef4444' : '#3b82f6';
                                const bootIcon = item.boot_type === 'HARD' ? '⚑' : '⚙';
                                parts.push(`<small style="color: ${bootColor};"><strong>Boot Type:</strong> ${bootIcon} ${item.boot_type}</small>`);
                            }
                            // Handle home_screen_timeout for soft_hard_boot
                            if (item.home_screen_timeout) parts.push(`<small style="color:#10b981;"><strong>HOME Timeout:</strong> ${item.home_screen_timeout}s</small>`);
                            // Helper to get parameter from multiple locations (root, params object, alternative names)
                            const getParam = (...keys) => {
                                for (let key of keys) {
                                    if (item[key] !== undefined) return item[key];
                                    if (item.params && item.params[key] !== undefined) return item.params[key];
                                }
                                return null;
                            };
                            
                            // Standard parameters
                            const validationType = getParam('validation_type');
                            if (validationType) parts.push(`<small style="color:#f43f5e;"><strong>Validation Type:</strong> ${validationType}</small>`);
                            
                            const irKeys = getParam('ir_keys');
                            if (irKeys && irKeys.length) parts.push(`<small style="color:#10b981;"><strong>IR Keys:</strong> ${irKeys.join(', ')}</small>`);
                            
                            const voiceText = getParam('voice_text');
                            if (voiceText) parts.push(`<small style="color:#ec4899;"><strong>Voice:</strong> "${voiceText}"</small>`);
                            
                            const remoteKeys = getParam('remote_keys');
                            if (remoteKeys) parts.push(`<small style="color:#f97316;"><strong>Remote Keys:</strong> ${remoteKeys}</small>`);
                            
                            const expectedScreen = getParam('expected_screen');
                            if (expectedScreen) parts.push(`<small style="color:#3b82f6;"><strong>Expected Screen:</strong> ${expectedScreen}</small>`);
                            
                            const imageName = getParam('image_name');
                            if (imageName) parts.push(`<small style="color:#10b981;"><i class="bi bi-camera-fill"></i> <strong>Image Name:</strong> ${imageName}</small>`);
                            
                            const screenName = getParam('screen_name');
                            if (screenName) parts.push(`<small style="color:#10b981;"><strong>Screen Name:</strong> ${screenName}</small>`);
                            
                            const waitSeconds = getParam('wait_seconds');
                            if (waitSeconds) parts.push(`<small style="color:#8b5cf6;"><strong>Wait:</strong> ${waitSeconds}s</small>`);
                            
                            // For execute_command and validate_results: support both command_text and command
                            const command = getParam('command_text', 'command');
                            if (command) {
                                const cmd = command.substring(0, 60) + (command.length > 60 ? '...' : '');
                                parts.push(`<small style="color:#06b6d4;"><strong>Command:</strong> ${cmd}</small>`);
                            }
                            
                            const expectedOutput = getParam('expected_output');
                            if (expectedOutput) {
                                const exp = expectedOutput.substring(0, 60) + (expectedOutput.length > 60 ? '...' : '');
                                parts.push(`<small style="color:#f59e0b;"><strong>Expected:</strong> ${exp}</small>`);
                            }
                            
                            // Remote type for various methods (deepsleep, maintenance_deepsleep_wakeup, maintenance_CURL_deepsleep_wakeup, standby_deep_sleep_ir_control)
                            const remoteType = getParam('remote_type');
                            if (remoteType) {
                                const methodName = item.method;
                                if (methodName === 'standby_deep_sleep_ir_control') {
                                    parts.push(`<small style="color:#a855f7;"><i class="bi bi-broadcast"></i> <strong>Remote Type:</strong> ${remoteType}</small>`);
                                } else if (methodName === 'deepsleep') {
                                    parts.push(`<small style="color:#06b6d4;"><i class="bi bi-broadcast"></i> <strong>Remote:</strong> ${remoteType}</small>`);
                                } else if (methodName.includes('deepsleep') || methodName.includes('maintenance')) {
                                    parts.push(`<small style="color:#06b6d4;"><i class="bi bi-broadcast"></i> <strong>Remote:</strong> ${remoteType}</small>`);
                                }
                            }
                            
                            const checksCount = item.optional_checks?.custom_commands?.length || 0;
                            if (checksCount) parts.push(`<small style="color:#8b5cf6;"><strong>Checks:</strong> ${checksCount}</small>`);
                            
                            // Handle reboot_perf_v2_optimized specific parameters
                            const terminationIfNotFound = getParam('termination_if_not_found');
                            if (terminationIfNotFound) parts.push(`<small style="color: #f59e0b;"><i class="bi bi-exclamation-triangle-fill"></i> <strong>Stop if HOME NOT detected:</strong> Enabled</small>`);
                            
                            return parts.length ? parts.join('<br>') : '<small class="text-muted">No parameters</small>';
                        };

                        jobs.forEach(job => {
                            let methodDetails = '';
                            if (job.execution_queue && job.execution_queue.length) {
                                methodDetails = job.execution_queue.map((item, idx) => {
                                    return `<div class="mb-1"><strong>${idx + 1}. ${item.method}</strong><br>${renderParams(item)}</div>`;
                                }).join('');
                            } else {
                                methodDetails = renderParams(job);
                            }
                            const methodLabel = job.execution_queue && job.execution_queue.length
                                ? job.execution_queue.map(item => item.method).join(', ')
                                : job.method;
                            
                            // Handle both queued_at and created_at fields
                            const queuedDate = job.queued_at || job.created_at || job.start_time || 'N/A';
                            const formatDate = (dateStr) => {
                                try {
                                    return new Date(dateStr).toLocaleString();
                                } catch (e) {
                                    return dateStr;
                                }
                            };
                            
                            html += `<tr><td>${job.device_name} (${job.device_ip})</td><td>${methodLabel}</td><td style="max-width: 400px; overflow-y: auto; max-height: 200px;">${methodDetails}</td><td>${job.iterations}</td><td><span class="badge bg-info">${job.status}</span></td><td>${formatDate(queuedDate)}</td></tr>`;
                        });
                        html += '</tbody></table>';
                    }
                    document.getElementById('jobsTable').innerHTML = html;
                });
        }
        document.addEventListener('DOMContentLoaded', fetchJobs);
    </script>
</body>
</html>
