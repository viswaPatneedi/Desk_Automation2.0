<!-- Phase 22: Custom Log Filtering Modal for Reboot Performance v2 -->
<div class="modal fade" id="rebootPerfCustomLogsModal" tabindex="-1" aria-labelledby="rebootPerfCustomLogsLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" style="background: #1a202c; border-color: #2d3748; color: #e2e8f0;">
            <div class="modal-header" style="border-bottom-color: #2d3748;">
                <h5 class="modal-title" id="rebootPerfCustomLogsLabel">
                    <i class="bi bi-search"></i> Custom Log Pattern Search (Optional)
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body" style="max-height: 500px; overflow-y: auto;">
                <p style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 1rem;">
                    <i class="bi bi-info-circle"></i> Add optional custom grep patterns to search in device logs. Standard crash detection will run automatically.
                </p>

                <!-- Pattern List */
                <div id="customLogPatterns" style="margin-bottom: 1rem;">
                    <!-- Patterns added here -->
                </div>

                <!-- Add Pattern Button -->
                <button type="button" class="btn btn-sm btn-outline-success mb-3" onclick="addCustomLogPattern()">
                    <i class="bi bi-plus-circle"></i> Add Pattern
                </button>

                <div style="background: #0f1419; border: 1px solid #2d3748; border-radius: 8px; padding: 1rem; margin-top: 1.5rem;">
                    <h6 style="color: #60a5fa; margin-bottom: 1rem;">
                        <i class="bi bi-lightbulb"></i> Examples:
                    </h6>
                    <ul style="font-size: 0.85rem; color: #cbd5e1; margin: 0; padding-left: 1.25rem;">
                        <li><code style="background: #1a202c; padding: 0.2rem 0.4rem; border-radius: 3px;">process crashed</code> - Contains pattern</li>
                        <li><code style="background: #1a202c; padding: 0.2rem 0.4rem; border-radius: 3px;">ERROR|CRASH|FATAL</code> - Regex for multiple matches</li>
                        <li><code style="background: #1a202c; padding: 0.2rem 0.4rem; border-radius: 3px;">NOT contains</code> - Exclude pattern matches</li>
                    </ul>
                </div>
            </div>
            <div class="modal-footer" style="border-top-color: #2d3748;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyCustomLogPatterns()">
                    <i class="bi bi-check-lg"></i> Apply & Continue
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Phase 22: Custom Log Filtering Functions
let customLogPatternCount = 0;

function addCustomLogPattern() {
    customLogPatternCount++;
    const patternId = `pattern-${customLogPatternCount}`;
    const patternHTML = `
        <div class="custom-log-pattern" id="${patternId}" style="display: flex; gap: 0.75rem; margin-bottom: 1rem; align-items: flex-start;">
            <!-- Pattern Input -->
            <div style="flex: 1;">
                <input type="text" class="form-control form-control-sm" placeholder="Grep pattern (e.g., 'ERROR|CRASH')" 
                       style="background: #2d3748; border-color: #475569; color: #e2e8f0;" 
                       id="pattern-input-${customLogPatternCount}">
                <small style="color: #9ca3af; margin-top: 0.25rem; display: block;">
                    Regex patterns supported. Case-insensitive.
                </small>
            </div>
            
            <!-- Match Type -->
            <div style="min-width: 150px;">
                <select class="form-select form-select-sm" id="pattern-type-${customLogPatternCount}" 
                        style="background: #2d3748; border-color: #475569; color: #e2e8f0;">
                    <option value="contains">Contains</option>
                    <option value="not_contains">NOT Contains</option>
                </select>
            </div>
            
            <!-- Remove Button -->
            <button type="button" class="btn btn-sm btn-outline-danger mt-0" onclick="removeCustomLogPattern('${patternId}')" 
                    style="min-width: 40px; padding: 0.375rem 0.5rem;">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    `;
    
    const container = document.getElementById('customLogPatterns');
    const patternDiv = document.createElement('div');
    patternDiv.innerHTML = patternHTML;
    container.appendChild(patternDiv);
    
    console.log(`✅ Added custom log pattern input field ${customLogPatternCount}`);
}

function removeCustomLogPattern(patternId) {
    const element = document.getElementById(patternId);
    if (element) {
        element.remove();
        console.log(`✅ Removed pattern: ${patternId}`);
    }
}

function applyCustomLogPatterns() {
    // Collect all patterns
    const patterns = [];
    const container = document.getElementById('customLogPatterns');
    const patternDivs = container.querySelectorAll('.custom-log-pattern');
    
    patternDivs.forEach(div => {
        const inputElement = div.querySelector('input[type="text"]');
        const typeSelect = div.querySelector('select');
        
        if (inputElement && inputElement.value.trim()) {
            patterns.push({
                pattern: inputElement.value.trim(),
                type: typeSelect ? typeSelect.value : 'contains'
            });
        }
    });
    
    // Store in window object for method execution
    window.customLogPatterns = patterns;
    
    console.log(`✅ Applied ${patterns.length} custom log patterns:`, patterns);
    
    // Close modal
    const modal = bootstrap.Modal.getInstance(document.getElementById('rebootPerfCustomLogsModal'));
    if (modal) {
        modal.hide();
    }
    
    // Show status
    if (patterns.length > 0) {
        showNotification(`✅ ${patterns.length} custom pattern(s) added`, 'success');
    } else {
        showNotification('ℹ️ No custom patterns added - standard detection will run', 'info');
    }
}

// Initialize modal on page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('✅ Custom log filtering modal loaded');
    window.customLogPatterns = [];
});
</script>
