<!-- App Credentials Management Modal -->
<div class="modal fade" id="appCredentialsModal" tabindex="-1" aria-labelledby="appCredentialsLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" style="background: #0f172a; color: #e5e7eb; border: 1px solid #334155;">
            <div class="modal-header" style="border-bottom: 1px solid #334155;">
                <h5 class="modal-title" id="appCredentialsLabel" style="color: #10b981;">
                    <i class="bi bi-key-fill"></i> App Credentials Management
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="max-height: 700px; overflow-y: auto;">
                <div style="margin-bottom: 1.5rem;">
                    <h6 style="color: #60a5fa; margin-bottom: 1rem;">📋 Existing Credentials</h6>
                    
                    <!-- Team Filter -->
                    <div class="form-group mb-3">
                        <label for="filterTeam" class="form-label" style="color: #e5e7eb; font-size: 0.9rem;">Filter by Team</label>
                        <select id="filterTeam" class="form-select" onchange="filterCredentialsByTeam()" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                            <option value="">-- All Teams --</option>
                        </select>
                    </div>
                    
                    <div id="credentialsList" style="display: grid; gap: 0.75rem;">
                        <div style="text-align: center; color: #9ca3af;"><i class="bi bi-hourglass-end"></i> Loading credentials...</div>
                    </div>
                </div>

                <hr style="border-color: #334155; margin: 1.5rem 0;">

                <div style="margin-bottom: 1.5rem;">
                    <h6 style="color: #60a5fa; margin-bottom: 1rem;"><span id="formModeIcon">➕</span> <span id="formModeTitle">Add New Credential</span></h6>
                    
                    <div class="form-group mb-3">
                        <label for="credAppName" class="form-label" style="color: #e5e7eb;">App Name</label>
                        <input type="text" id="credAppName" class="form-control" placeholder="e.g., netflix, disney_plus, hulu" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                        <small style="color: #9ca3af; display: block; margin-top: 0.25rem;">App name cannot be changed during edit</small>
                    </div>

                    <div class="form-group mb-3">
                        <label for="credTeamName" class="form-label" style="color: #e5e7eb;">Team Name</label>
                        <input type="text" id="credTeamName" class="form-control" placeholder="e.g., QA-Team, Dev-Team" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                    </div>

                    <div class="form-group mb-3">
                        <label for="credUsername" class="form-label" style="color: #e5e7eb;">Username / Email</label>
                        <input type="text" id="credUsername" class="form-control" placeholder="netflix@example.com" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                    </div>

                    <div class="form-group mb-3">
                        <label for="credPassword" class="form-label" style="color: #e5e7eb;">Password</label>
                        <input type="password" id="credPassword" class="form-control" placeholder="••••••••" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                    </div>

                    <div class="form-group mb-3">
                        <label for="credLoginUrl" class="form-label" style="color: #e5e7eb;">Login URL<small style="color: #9ca3af;"> (optional)</small></label>
                        <input type="url" id="credLoginUrl" class="form-control" placeholder="https://login.netflix.com" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                    </div>

                    <!-- Profile Name - Hidden for now -->
                    <div class="form-group mb-3" style="display: none;">
                        <label for="credProfileName" class="form-label" style="color: #e5e7eb;">Profile Name<small style="color: #9ca3af;"> (optional)</small></label>
                        <input type="text" id="credProfileName" class="form-control" placeholder="e.g., Kids, Adult, Main" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                    </div>

                    <!-- Device Type - Hidden for now -->
                    <div class="form-group mb-3" style="display: none;">
                        <label for="credDeviceType" class="form-label" style="color: #e5e7eb;">Device Type<small style="color: #9ca3af;"> (optional)</small></label>
                        <select id="credDeviceType" class="form-select" style="background: #1f2937; color: #e5e7eb; border: 1px solid #374151;">
                            <option value="">-- All Devices --</option>
                            <option value="RDK">RDK</option>
                            <option value="XUMO-TV">XUMO-TV</option>
                            <option value="FIRETV">FireTV</option>
                            <option value="ROKU">Roku</option>
                        </select>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="credIsPrimary" checked style="cursor: pointer;">
                        <label class="form-check-label" for="credIsPrimary" style="color: #e5e7eb; cursor: pointer;">
                            Set as Primary Credential
                        </label>
                        <small style="color: #9ca3af; display: block; margin-top: 0.25rem;">Primary credentials are used by default when executing methods</small>
                    </div>

                    <!-- Hidden field to store credential_id when editing -->
                    <input type="hidden" id="editingCredentialId" value="">

                    <div style="display: flex; gap: 0.5rem;">
                        <button type="button" id="saveCredentialBtn" class="btn flex-grow-1" onclick="saveAppCredential()" style="background: #10b981; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; margin-top: 1rem;">
                            <i class="bi bi-cloud-plus"></i> Save Credential
                        </button>
                        <button type="button" id="cancelEditBtn" class="btn" onclick="cancelEdit()" style="background: #6b7280; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; margin-top: 1rem; display: none; flex-grow: 1;">
                            <i class="bi bi-x-circle"></i> Cancel
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #334155; background: #1f2937;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="background: #6b7280; border: none; color: white;">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Store all credentials for filtering
    let allCredentials = [];

    async function showAppCredentialsPanel() {
        // Show the modal
        const modal = new bootstrap.Modal(document.getElementById('appCredentialsModal'));
        modal.show();
        
        // Check auth status first
        try {
            console.log('🔐 Checking authentication status...');
            const authResponse = await fetch('/api/auth/status', {
                method: 'GET',
                credentials: 'include'
            });
            const authData = await authResponse.json();
            console.log('🔑 Auth status:', authData);
            
            if (!authData.authenticated) {
                document.getElementById('credentialsList').innerHTML = `<div style="color: #ef4444;"><i class="bi bi-exclamation-circle"></i> ⚠️ Not authenticated. Please log in first.</div>`;
                return;
            }
            
            if (!authData.is_super_admin) {
                document.getElementById('credentialsList').innerHTML = `<div style="color: #ef4444;"><i class="bi bi-shield-exclamation"></i> ⛔ Not a super admin. Only super admins can manage credentials.</div>`;
                return;
            }
            
            // Load credentials if authenticated and is super admin
            await loadAppCredentials();
        } catch (error) {
            console.error('❌ Error checking auth status:', error);
            document.getElementById('credentialsList').innerHTML = `<div style="color: #ef4444;"><i class="bi bi-exclamation-triangle"></i> Error checking authentication: ${error.message}</div>`;
        }
    }

    async function loadAppCredentials() {
        try {
            console.log('🔄 Loading app credentials...');
            const response = await fetch('/api/admin/app-credentials', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include' // Include session cookies
            });

            console.log(`📡 Response status: ${response.status}`);

            if (!response.ok) {
                if (response.status === 403) {
                    alert('⛔ Access denied. Only super admins can manage app credentials.');
                    return;
                }
                if (response.status === 401) {
                    alert('⚠️ You need to be logged in. Please login and try again.');
                    return;
                }
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const credentials = await response.json();
            console.log('✅ Credentials loaded:', credentials);
            
            // Store all credentials for filtering
            allCredentials = credentials || [];
            
            // Populate team filter dropdown
            populateTeamFilter(allCredentials);
            
            // Display all credentials initially
            displayCredentials(allCredentials);
        } catch (error) {
            console.error('❌ Error loading credentials:', error);
            document.getElementById('credentialsList').innerHTML = `<div style="color: #ef4444;"><i class="bi bi-exclamation-triangle"></i> Error loading credentials: ${error.message}<br><small style="color: #9ca3af; margin-top: 0.5rem; display: block;">Try refreshing the page or logging in again.</small></div>`;
        }
    }

    function populateTeamFilter(credentials) {
        // Get unique teams from credentials
        const teams = [...new Set(credentials.map(c => c.team_name))].sort();
        
        const filterSelect = document.getElementById('filterTeam');
        const currentValue = filterSelect.value;
        
        // Clear existing options except the first one
        filterSelect.innerHTML = '<option value="">-- All Teams --</option>';
        
        // Add team options
        teams.forEach(team => {
            const option = document.createElement('option');
            option.value = team;
            option.textContent = team;
            filterSelect.appendChild(option);
        });
        
        // Restore previous selection if it still exists
        filterSelect.value = currentValue;
    }

    function filterCredentialsByTeam() {
        const selectedTeam = document.getElementById('filterTeam').value;
        
        if (selectedTeam === '') {
            // Show all credentials
            displayCredentials(allCredentials);
        } else {
            // Filter credentials by selected team
            const filteredCredentials = allCredentials.filter(cred => cred.team_name === selectedTeam);
            displayCredentials(filteredCredentials);
        }
    }

    function displayCredentials(credentials) {
        if (!credentials || credentials.length === 0) {
            document.getElementById('credentialsList').innerHTML = '<div style="color: #9ca3af;"><i class="bi bi-info-circle"></i> No credentials configured yet</div>';
            return;
        }

        const html = credentials.map((cred, idx) => `
            <div style="background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.75rem;">
                    <div>
                        <strong style="color: #60a5fa;">${cred.app_name.toUpperCase()}</strong>
                        ${cred.is_primary ? '<span style="background: #10b981; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-left: 0.5rem;">PRIMARY</span>' : ''}
                        ${!cred.is_active ? '<span style="background: #f59e0b; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-left: 0.5rem;">INACTIVE</span>' : ''}
                    </div>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end;">
                        <button onclick="editCredential('${cred.credential_id}')" style="background: #3b82f6; border: none; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;" title="Edit Credential"><i class="bi bi-pencil-square"></i> Edit</button>
                        ${!cred.is_primary ? `<button onclick="setPrimaryCredential('${cred.credential_id}')" style="background: #f59e0b; border: none; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;" title="Set as Primary"><i class="bi bi-star"></i> Primary</button>` : ''}
                        <button onclick="deleteCredential('${cred.credential_id}')" style="background: #ef4444; border: none; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;" title="Delete"><i class="bi bi-trash"></i> Delete</button>
                    </div>
                </div>
                <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 0.5rem;">
                    <div><strong>Username:</strong> ${cred.username}</div>
                    <div><strong>Team:</strong> ${cred.team_name}</div>
                    ${cred.profile_name ? `<div><strong>Profile:</strong> ${cred.profile_name}</div>` : ''}
                    ${cred.device_type ? `<div><strong>Device Type:</strong> ${cred.device_type}</div>` : ''}
                    <div><strong>Used ${cred.usage_count || 0} times</strong> ${cred.last_used_at ? `(Last: ${new Date(cred.last_used_at).toLocaleDateString()})` : '(Never used)'}</div>
                </div>
            </div>
        `).join('');

        document.getElementById('credentialsList').innerHTML = html;
    }

    async function saveAppCredential() {
        const editingCredentialId = document.getElementById('editingCredentialId').value;
        const appName = document.getElementById('credAppName').value;
        const teamName = document.getElementById('credTeamName').value;
        const username = document.getElementById('credUsername').value;
        const password = document.getElementById('credPassword').value;
        const loginUrl = document.getElementById('credLoginUrl').value;
        const profileName = document.getElementById('credProfileName').value;
        const deviceType = document.getElementById('credDeviceType').value;
        const isPrimary = document.getElementById('credIsPrimary').checked;

        // Validation
        if (!appName || !teamName || !username) {
            alert('⛔ Please fill in App Name, Team Name, and Username');
            return;
        }

        if (!editingCredentialId && !password) {
            alert('⛔ Password is required for new credentials');
            return;
        }

        try {
            let url, method, body;

            if (editingCredentialId) {
                // Update existing credential
                url = `/api/admin/app-credentials/${editingCredentialId}`;
                method = 'PUT';
                body = {
                    username: username,
                    login_url: loginUrl,
                    profile_name: profileName,
                    device_type: deviceType,
                    is_primary: isPrimary
                };
                // Only include password if it's not empty
                if (password && password.trim() !== '') {
                    body.password = password;
                }
            } else {
                // Create new credential
                url = '/api/admin/app-credentials';
                method = 'POST';
                body = {
                    app_name: appName,
                    username: username,
                    password: password,
                    login_url: loginUrl,
                    team_name: teamName,
                    profile_name: profileName,
                    device_type: deviceType,
                    is_primary: isPrimary
                };
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include', // Include session cookies
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `HTTP ${response.status}`);
            }

            // Clear form and reset mode
            resetCredentialForm();
            
            // Reload list and reset filter
            document.getElementById('filterTeam').value = '';
            await loadAppCredentials();
            
            if (editingCredentialId) {
                showNotification('✅ Credential updated successfully', 'success');
            } else {
                showNotification('✅ Credential created successfully', 'success');
            }
        } catch (error) {
            console.error('Error saving credential:', error);
            showNotification(`❌ Error saving credential: ${error.message}`, 'error');
        }
    }

    async function editCredential(credentialId) {
        try {
            // Fetch credential details (admin can fetch with password)
            const response = await fetch(`/api/admin/app-credentials/${credentialId}?include_password=true`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include'
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: Unable to load credential`);
            }

            const cred = await response.json();
            
            // Populate form with credential data
            document.getElementById('credAppName').value = cred.app_name;
            document.getElementById('credAppName').disabled = true; // Can't change app name
            document.getElementById('credTeamName').value = cred.team_name;
            document.getElementById('credUsername').value = cred.username;
            document.getElementById('credPassword').value = cred.password === '***hidden***' ? '' : (cred.password || '');
            document.getElementById('credLoginUrl').value = cred.login_url || '';
            document.getElementById('credProfileName').value = cred.profile_name || '';
            document.getElementById('credDeviceType').value = cred.device_type || '';
            document.getElementById('credIsPrimary').checked = cred.is_primary || false;
            
            // Set the hidden credential_id field
            document.getElementById('editingCredentialId').value = credentialId;
            
            // Update form mode
            document.getElementById('formModeIcon').textContent = '✏️';
            document.getElementById('formModeTitle').textContent = 'Edit Credential';
            document.getElementById('saveCredentialBtn').innerHTML = '<i class="bi bi-cloud-check"></i> Update Credential';
            document.getElementById('cancelEditBtn').style.display = 'flex';
            
            // Scroll to form
            document.querySelector('.modal-body').scrollTop = document.querySelector('.modal-body').scrollHeight;
            
            showNotification('✏️ Editing credential - Password field is empty (leave blank to keep current)', 'info');
        } catch (error) {
            console.error('Error loading credential:', error);
            showNotification(`❌ Error loading credential: ${error.message}`, 'error');
        }
    }

    function cancelEdit() {
        resetCredentialForm();
        showNotification('✅ Edit cancelled', 'info');
    }

    function resetCredentialForm() {
        // Clear form fields
        document.getElementById('credAppName').value = '';
        document.getElementById('credAppName').disabled = false;
        document.getElementById('credTeamName').value = '';
        document.getElementById('credUsername').value = '';
        document.getElementById('credPassword').value = '';
        document.getElementById('credLoginUrl').value = '';
        document.getElementById('credProfileName').value = '';
        document.getElementById('credDeviceType').value = '';
        document.getElementById('credIsPrimary').checked = true;
        
        // Clear editing mode
        document.getElementById('editingCredentialId').value = '';
        
        // Reset form mode to "Add"
        document.getElementById('formModeIcon').textContent = '➕';
        document.getElementById('formModeTitle').textContent = 'Add New Credential';
        document.getElementById('saveCredentialBtn').innerHTML = '<i class="bi bi-cloud-plus"></i> Save Credential';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    async function setPrimaryCredential(credentialId) {
        try {
            const response = await fetch(`/api/admin/app-credentials/${credentialId}/set-primary`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include' // Include session cookies
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadAppCredentials();
            showNotification('✅ Primary credential updated', 'success');
        } catch (error) {
            console.error('Error setting primary credential:', error);
            showNotification(`❌ Error: ${error.message}`, 'error');
        }
    }

    async function deleteCredential(credentialId) {
        if (!confirm('⚠️ Are you sure you want to delete this credential?')) {
            return;
        }

        try {
            const response = await fetch(`/api/admin/app-credentials/${credentialId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include' // Include session cookies
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadAppCredentials();
            showNotification('✅ Credential deleted successfully', 'success');
        } catch (error) {
            console.error('Error deleting credential:', error);
            showNotification(`❌ Error: ${error.message}`, 'error');
        }
    }
</script>
