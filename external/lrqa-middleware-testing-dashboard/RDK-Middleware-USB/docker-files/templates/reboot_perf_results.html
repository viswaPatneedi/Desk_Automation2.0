<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reboot Performance Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        :root {
            --primary-color: #6b7280;
            --secondary-color: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #6b7280;
            --dark-color: #1f2937;
            --darker-color: #111827;
            --light-grey: #9ca3af;
            --medium-grey: #6b7280;
            --dark-grey: #374151;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --card-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
        
        body {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
        }
        
        .dashboard-card {
            background: #1f2937;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
            overflow: visible;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #374151;
        }
        
        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-lg);
        }
        
        .card-header-custom {
            background: #4b5563;
            color: #f3f4f6;
            padding: 1.25rem 1.5rem;
            border: none;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .card-header-custom h5 {
            margin: 0;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .card-body-custom {
            padding: 1.5rem;
        }
        
        .table-modern {
            margin-bottom: 0;
        }
        
        .table-modern thead th {
            background: #374151;
            color: #f3f4f6;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding: 1rem;
            border: none;
        }
        
        .table-modern thead th:first-child {
            border-radius: 10px 0 0 0;
        }
        
        .table-modern thead th:last-child {
            border-radius: 0 10px 0 0;
        }
        
        .table-modern tbody td {
            padding: 1rem;
            border-bottom: 1px solid #374151;
            vertical-align: middle;
            color: #1f2937;
        }
        
        .table-modern tbody tr:hover {
            background: #374151;
        }
        
        .table-modern tbody tr:last-child td {
            border-bottom: none;
        }
        
        .table-modern tbody td strong {
            color: #111827;
        }
        
        .badge-success {
            background: var(--success-color);
            color: white;
        }
        
        .badge-danger {
            background: var(--danger-color);
            color: white;
        }
        
        .badge-secondary {
            background: #6b7280;
            color: white;
        }
        
        .badge-status-completed {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .badge-status-failed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .badge-status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .btn-filter {
            background: #4b5563;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            color: #f3f4f6;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-filter:hover {
            background: #6b7280;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(75, 85, 99, 0.4);
        }

        .btn-clear {
            background: #6b7280;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            color: #f3f4f6;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            background: #9ca3af;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(107, 114, 128, 0.4);
        }

        .btn-export {
            background: var(--success-color);
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-export:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        #jobsDropdown .dropdown-menu .form-check-label {
            color: #e5e7eb;
        }
        #jobsDropdown .dropdown-menu .form-check-input {
            background-color: #111827;
            border-color: #4b5563;
        }
        #jobsDropdown .dropdown-menu .form-check-input:checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        #jobsDropdown .dropdown-menu .form-check-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.25);
        }
        #devicesDropdown .dropdown-menu .form-check-label {
            color: #e5e7eb;
        }
        #devicesDropdown .dropdown-menu .form-check-input {
            background-color: #111827;
            border-color: #4b5563;
        }
        #devicesDropdown .dropdown-menu .form-check-input:checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        #devicesDropdown .dropdown-menu .form-check-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.25);
        }
    </style>
</head>

    <div class="container-fluid pb-5" style="padding-left: 20px; padding-right: 20px;">
        <div class="dashboard-card mb-4">
            <div class="card-header-custom">
                <i class="bi bi-funnel"></i>
                <h5>Filter by Jobs</h5>
            </div>
            <div class="card-body-custom">
                <div class="row g-3 align-items-center">
                    <div class="col-12 col-lg-5">
                        <div class="dropdown" id="jobsDropdown">
                            <button class="btn btn-outline-light w-100 d-flex align-items-center justify-content-between" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="jobsDropdownLabel">Select jobs</span>
                                <i class="bi bi-chevron-down"></i>
                            </button>
                            <div class="dropdown-menu p-3 w-100" style="max-height: 320px; overflow-y: auto; background: #111827; color: #e5e7eb; border: 1px solid #374151;">
                                <div id="jobsFilter"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-5">
                        <div class="dropdown" id="devicesDropdown">
                            <button class="btn btn-outline-light w-100 d-flex align-items-center justify-content-between" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="devicesDropdownLabel">Select devices</span>
                                <i class="bi bi-chevron-down"></i>
                            </button>
                            <div class="dropdown-menu p-3 w-100" style="max-height: 320px; overflow-y: auto; background: #111827; color: #e5e7eb; border: 1px solid #374151;">
                                <div id="devicesFilter"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-2 d-flex gap-2">
                        <button class="btn btn-sm btn-filter" onclick="applyFilters()">
                            <i class="bi bi-check2-circle"></i> Apply Filter
                        </button>
                        <button class="btn btn-sm btn-clear" onclick="clearFilters()">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>

                            <i class="bi bi-download"></i> Export

        <div id="resultsContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const preselected = (params.get('job_ids') || '')
            .split(',')
            .map(id => id.trim())
            .filter(Boolean);

        let availableJobs = [];
        let availableDevices = [];

        async function fetchResults(selectedJobIds = [], selectedDeviceIps = []) {
            const params = new URLSearchParams();
            if (selectedJobIds.length) params.set('job_ids', selectedJobIds.join(','));
            if (selectedDeviceIps.length) params.set('device_ips', selectedDeviceIps.join(','));
            const query = params.toString() ? `?${params.toString()}` : '';
            const response = await fetch(`/api/reboot-perf-results${query}`);
            const data = await response.json();
            availableJobs = data.available_jobs || [];
            renderJobFilters(availableJobs, selectedJobIds.length ? selectedJobIds : preselected);
            availableDevices = getDevicesFromResults(data.results_by_device || {});
            renderDeviceFilters(availableDevices, selectedDeviceIps);
            renderResults(data.results_by_device || {});
        }

        function getDevicesFromResults(resultsByDevice) {
            return Object.keys(resultsByDevice).map(deviceIp => {
                const device = resultsByDevice[deviceIp] || {};
                return {
                    device_ip: deviceIp,
                    device_name: device.device_name || 'Unknown Device'
                };
            });
        }

        function renderJobFilters(jobs, selectedJobIds) {
            const container = document.getElementById('jobsFilter');
            container.innerHTML = '';

            if (!jobs.length) {
                container.innerHTML = '<div class="text-muted">No reboot performance jobs available.</div>';
                return;
            }

            const allId = 'job-select-all';
            const allWrapper = document.createElement('div');
            allWrapper.className = 'form-check mb-2';
            allWrapper.innerHTML = `
                <input class="form-check-input" type="checkbox" value="__all__" id="${allId}">
                <label class="form-check-label" for="${allId}">
                    <strong>All Jobs</strong>
                </label>
            `;
            container.appendChild(allWrapper);

            jobs.forEach(job => {
                const isChecked = selectedJobIds.includes(job.job_id) ? 'checked' : '';
                const item = document.createElement('div');
                item.className = 'form-check mb-2';
                item.innerHTML = `
                    <input class="form-check-input job-filter-item" type="checkbox" value="${job.job_id}" id="job-${job.job_id}" ${isChecked}>
                    <label class="form-check-label" for="job-${job.job_id}">
                        <strong>${job.device_name}</strong> (${job.device_ip})<br>
                            <small style="color:#9ca3af;">${formatImageName(job.image_name)} • ${job.iterations || '-'} ITR • ${job.status}</small>
                    </label>
                `;
                container.appendChild(item);
            });

            const allCheckbox = document.getElementById(allId);
            const jobCheckboxes = Array.from(document.querySelectorAll('.job-filter-item'));
            const updateAllState = () => {
                const checkedCount = jobCheckboxes.filter(c => c.checked).length;
                allCheckbox.indeterminate = checkedCount > 0 && checkedCount < jobCheckboxes.length;
                allCheckbox.checked = checkedCount === jobCheckboxes.length && jobCheckboxes.length > 0;
            };

            allCheckbox.addEventListener('change', (e) => {
                jobCheckboxes.forEach(c => { c.checked = e.target.checked; });
                updateDropdownLabel();
            });

            jobCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    updateAllState();
                    updateDropdownLabel();
                });
            });

            updateAllState();
            updateDropdownLabel();
        }

        function updateDropdownLabel() {
            const label = document.getElementById('jobsDropdownLabel');
            const selected = Array.from(document.querySelectorAll('.job-filter-item:checked'));
            if (!selected.length) {
                label.textContent = 'Select jobs';
                return;
            }
            if (selected.length === 1) {
                const id = selected[0].value;
                const job = availableJobs.find(j => j.job_id === id);
                label.textContent = job ? `${job.device_name} (${job.device_ip})` : '1 job selected';
                return;
            }
            label.textContent = `${selected.length} jobs selected`;
        }

        function renderDeviceFilters(devices, selectedDeviceIps) {
            const container = document.getElementById('devicesFilter');
            container.innerHTML = '';

            if (!devices.length) {
                container.innerHTML = '<div class="text-muted">No devices available.</div>';
                return;
            }

            const allId = 'device-select-all';
            const allWrapper = document.createElement('div');
            allWrapper.className = 'form-check mb-2';
            allWrapper.innerHTML = `
                <input class="form-check-input" type="checkbox" value="__all__" id="${allId}">
                <label class="form-check-label" for="${allId}">
                    <strong>All Devices</strong>
                </label>
            `;
            container.appendChild(allWrapper);

            devices.forEach(device => {
                const isChecked = selectedDeviceIps.includes(device.device_ip) ? 'checked' : '';
                const item = document.createElement('div');
                item.className = 'form-check mb-2';
                item.innerHTML = `
                    <input class="form-check-input device-filter-item" type="checkbox" value="${device.device_ip}" id="device-${device.device_ip}" ${isChecked}>
                    <label class="form-check-label" for="device-${device.device_ip}">
                        <strong>${device.device_name}</strong> (${device.device_ip})
                    </label>
                `;
                container.appendChild(item);
            });

            const allCheckbox = document.getElementById(allId);
            const deviceCheckboxes = Array.from(document.querySelectorAll('.device-filter-item'));
            const updateAllState = () => {
                const checkedCount = deviceCheckboxes.filter(c => c.checked).length;
                allCheckbox.indeterminate = checkedCount > 0 && checkedCount < deviceCheckboxes.length;
                allCheckbox.checked = checkedCount === deviceCheckboxes.length && deviceCheckboxes.length > 0;
            };

            allCheckbox.addEventListener('change', (e) => {
                deviceCheckboxes.forEach(c => { c.checked = e.target.checked; });
                updateDeviceDropdownLabel();
            });

            deviceCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    updateAllState();
                    updateDeviceDropdownLabel();
                });
            });

            updateAllState();
            updateDeviceDropdownLabel();
        }

        function updateDeviceDropdownLabel() {
            const label = document.getElementById('devicesDropdownLabel');
            const selected = Array.from(document.querySelectorAll('.device-filter-item:checked'));
            if (!selected.length) {
                label.textContent = 'Select devices';
                return;
            }
            if (selected.length === 1) {
                const id = selected[0].value;
                const device = availableDevices.find(d => d.device_ip === id);
                label.textContent = device ? `${device.device_name} (${device.device_ip})` : '1 device selected';
                return;
            }
            label.textContent = `${selected.length} devices selected`;
        }

        function renderResults(resultsByDevice) {
            const container = document.getElementById('resultsContainer');
            const deviceKeys = Object.keys(resultsByDevice);

            if (!deviceKeys.length) {
                container.innerHTML = '<div class="text-muted">No results found for the selected jobs.</div>';
                return;
            }

            container.innerHTML = deviceKeys.map(deviceIp => {
                const device = resultsByDevice[deviceIp];
                const jobs = Object.values(device.jobs || {});

                const jobBlocks = jobs.map(job => {
                    const rows = (job.per_iteration || []).map(row => {
                        let crashDetails = '-';
                        if (row.crash_details && row.crash_details.length > 0) {
                            const crashItems = row.crash_details.map(detail => {
                                let html = '';
                                // Check if we have output lines
                                const hasOutput = detail.output_lines && detail.output_lines.length > 0;
                                const hasOutputText = detail.output && detail.output.trim().length > 0;
                                
                                if (hasOutput || hasOutputText) {
                                    // Display actual log output
                                    html = `<div style="font-size: 0.85rem !important; color: #000000 !important; font-family: monospace !important; background: #ffebee !important; padding: 0.5rem !important; border-left: 3px solid #ef4444 !important; border-radius: 3px !important; max-height: 150px !important; overflow-y: auto !important;">`;
                                    
                                    if (hasOutput) {
                                        detail.output_lines.forEach(line => {
                                            if (line.trim()) {
                                                html += `<span style="color: #000000 !important; display: block;">${line}</span>`;
                                            }
                                        });
                                        if (detail.line_count > 5) {
                                            html += `<span style="color: #666666 !important; font-size: 0.8rem !important; display: block;">... +${detail.line_count - 5} more</span>`;
                                        }
                                    } else if (hasOutputText) {
                                        // Fallback to raw output text
                                        html += `<span style="color: #000000 !important;">${detail.output}</span>`;
                                    }
                                    html += `</div>`;
                                } else {
                                    // No output, show description
                                    html = `<div style="font-size: 0.85rem !important; color: #000000 !important; font-style: italic !important; background: #ffebee !important; padding: 0.5rem !important; border-left: 3px solid #ef4444 !important; border-radius: 3px !important;">${detail.description || 'Crash detected'}</div>`;
                                }
                                return html;
                            }).join('');
                            crashDetails = crashItems;
                        }

                        return `
                            <tr>
                                <td><strong>ITR-${row.iteration}</strong></td>
                                <td>${row.performance_seconds !== null && row.performance_seconds !== undefined ? row.performance_seconds.toFixed(2) : '-'}</td>
                                <td>${row.crash_found ? '<span class="badge badge-danger">YES</span>' : '<span class="badge badge-success">NO</span>'}</td>
                                <td>${crashDetails}</td>
                                <td>${row.logs_collected ? '<span class="badge badge-success">Collected</span>' : '<span class="badge badge-secondary">Not Collected</span>'}</td>
                            </tr>
                        `;
                    }).join('');

                    // Calculate average reboot time
                    const validTimes = (job.per_iteration || [])
                        .filter(row => row.performance_seconds !== null && row.performance_seconds !== undefined)
                        .map(row => row.performance_seconds);
                    
                    const avgRebootTime = validTimes.length > 0 
                        ? (validTimes.reduce((a, b) => a + b, 0) / validTimes.length).toFixed(2)
                        : '-';

                    // Build crash summary display
                    const crashSummary = job.crash_summary || {};
                    const crashesFound = crashSummary.crashes_found || 0;
                    const totalIterations = crashSummary.total_iterations || 0;
                    const crashSummaryHtml = `<div style="text-align: right; padding: 0.5rem; background: ${crashesFound > 0 ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)'}; border-radius: 6px;">
                        <div style="font-size: 0.75rem; color: #9ca3af; text-transform: uppercase;">Crashes</div>
                        <div style="font-size: 1rem; font-weight: 700; color: ${crashesFound > 0 ? '#fca5a5' : '#86efac'};">${crashesFound} / ${totalIterations}</div>
                    </div>`;

                    return `
                        <div class="dashboard-card mb-3">
                            <div class="card-header-custom" style="justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    <div>
                                        <strong style="color: #f3f4f6;">${job.device_name}</strong> <span style="color: #9ca3af;">(${job.device_ip})</span>
                                        <div style="font-size: 0.85rem; color: #9ca3af; margin-top: 0.25rem;">${formatImageName(job.image_name)}</div>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    ${crashSummaryHtml}
                                    <div style="text-align: right;">
                                        <div style="font-size: 0.85rem; color: #9ca3af;">Avg Reboot Time</div>
                                        <div style="font-size: 1.25rem; font-weight: 700; color: #10b981;">${avgRebootTime}s</div>
                                    </div>
                                    <span class="badge-status-${job.status === 'completed' ? 'completed' : job.status === 'failed' ? 'failed' : 'pending'}">${job.status || 'unknown'}</span>
                                </div>
                            </div>
                            <div class="card-body-custom" style="max-height: 600px; overflow-y: auto;">
                                <div class="table-responsive">
                                    <table class="table table-sm table-modern">
                                        <thead>
                                            <tr>
                                                <th>Iteration</th>
                                                <th>Reboot Time (s)</th>
                                                <th>Crash Found</th>
                                                <th>Crash Details</th>
                                                <th>Logs Collected</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rows}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="dashboard-card mb-4">
                        <div class="card-header-custom">
                            <i class="bi bi-hdd-network"></i>
                            <h5>${device.device_name} (${device.device_ip})</h5>
                        </div>
                        <div class="card-body-custom">
                            ${jobBlocks}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatImageName(imageName) {
            if (!imageName) return 'Image: N/A';
            const trimmed = imageName.trim();
            const match = trimmed.match(/imagename:([^\s]+)/i);
            if (match && match[1]) {
                return match[1];
            }
            return trimmed.split(' ')[0];
        }

        function applyFilters() {
            const selected = Array.from(document.querySelectorAll('.job-filter-item:checked'))
                .map(input => input.value);
            const selectedDevices = Array.from(document.querySelectorAll('.device-filter-item:checked'))
                .map(input => input.value);
            const params = new URLSearchParams();
            if (selected.length) params.set('job_ids', selected.join(','));
            if (selectedDevices.length) params.set('device_ips', selectedDevices.join(','));
            const query = params.toString() ? `?${params.toString()}` : '';
            window.history.replaceState({}, '', `${window.location.pathname}${query}`);
            fetchResults(selected, selectedDevices);
        }

        function clearFilters() {
            window.history.replaceState({}, '', window.location.pathname);
            fetchResults([], []);
        }

        function downloadExcel() {
            const selected = Array.from(document.querySelectorAll('.job-filter-item:checked'))
                .map(input => input.value);
            const selectedDevices = Array.from(document.querySelectorAll('.device-filter-item:checked'))
                .map(input => input.value);
            
            const params = new URLSearchParams();
            if (selected.length) params.set('job_ids', selected.join(','));
            if (selectedDevices.length) params.set('device_ips', selectedDevices.join(','));
            
            const url = `/download/reboot-perf-results${params.toString() ? '?' + params.toString() : ''}`;
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const jobIds = (params.get('job_ids') || '').split(',').map(s => s.trim()).filter(Boolean);
            const deviceIps = (params.get('device_ips') || '').split(',').map(s => s.trim()).filter(Boolean);
            fetchResults(jobIds.length ? jobIds : preselected, deviceIps);
        });
    </script>
</body>
</html>
