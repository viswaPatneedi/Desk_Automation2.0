<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - LRQA MW Testing Dashboard</title>
    
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .verify-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        
        .verify-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-section i {
            font-size: 3rem;
            color: #6b7280;
        }
        
        .logo-section h2 {
            margin-top: 15px;
            color: #1f2937;
            font-weight: 700;
        }
        
        .logo-section p {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            font-weight: 600;
        }
        
        .form-control:focus {
            border-color: #6b7280;
            box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
        }
        
        .btn-verify {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 114, 128, 0.4);
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }
        
        .back-link a {
            color: #4b5563;
            font-weight: 600;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
            color: #374151;
        }
        
        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info-box {
            background: #f3f4f6;
            border-left: 4px solid #6b7280;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info-box p {
            margin: 0;
            color: #4b5563;
            font-size: 0.9rem;
        }
        
        .resend-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .resend-link a {
            color: #6b7280;
            font-size: 0.9rem;
            text-decoration: none;
        }
        
        .resend-link a:hover {
            text-decoration: underline;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="verify-card">
            <div class="logo-section">
                <i class="bi bi-shield-lock-fill"></i>
                <h2>Verify Your Code</h2>
                <p>Enter the 6-digit code sent to your email</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}
            
            <div class="info-box">
                <p><i class="bi bi-envelope-check-fill"></i> We sent a verification code to <strong>{{ email }}</strong></p>
            </div>
            
            <form method="POST" action="/verify-reset-code">
                <div class="mb-4">
                    <label for="code" class="form-label text-center w-100">
                        <i class="bi bi-123"></i> Verification Code
                    </label>
                    <input type="text" class="form-control" id="code" name="code" 
                           placeholder="000000" maxlength="6" pattern="[0-9]{6}" 
                           required autofocus>
                    <small class="text-muted">Enter the 6-digit code from your email</small>
                </div>
                
                <button type="submit" class="btn btn-verify">
                    <i class="bi bi-check-circle-fill"></i> Verify Code
                </button>
            </form>
            
            <div class="resend-link">
                <a href="/forgot-password"><i class="bi bi-arrow-clockwise"></i> Didn't receive code? Resend</a>
            </div>
            
            <div class="back-link">
                <a href="/login"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-submit when 6 digits entered
        document.getElementById('code').addEventListener('input', function(e) {
            if (this.value.length === 6) {
                // Optional: Auto-submit
                // this.form.submit();
            }
        });
        
        // Only allow numbers
        document.getElementById('code').addEventListener('keypress', function(e) {
            if (!/[0-9]/.test(e.key) && e.key !== 'Backspace') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
