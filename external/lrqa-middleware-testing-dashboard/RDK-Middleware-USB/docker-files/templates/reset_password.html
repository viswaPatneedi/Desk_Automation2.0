<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LRQA MW Testing Dashboard</title>
    
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .reset-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        
        .reset-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-section i {
            font-size: 3rem;
            color: #10b981;
        }
        
        .logo-section h2 {
            margin-top: 15px;
            color: #1f2937;
            font-weight: 700;
        }
        
        .logo-section p {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .btn-reset {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }
        
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }
        
        .back-link a {
            color: #4b5563;
            font-weight: 600;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
            color: #374151;
        }
        
        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .password-strength {
            margin-top: 5px;
            font-size: 0.85rem;
        }
        
        .password-requirements {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        
        .password-requirements ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        
        .password-requirements li {
            color: #6b7280;
            margin: 3px 0;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="logo-section">
                <i class="bi bi-check-circle-fill"></i>
                <h2>Create New Password</h2>
                <p>Enter your new password below</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}
            
            <div class="password-requirements">
                <strong><i class="bi bi-info-circle-fill"></i> Password Requirements:</strong>
                <ul>
                    <li>At least 8 characters long</li>
                    <li>Mix of letters and numbers recommended</li>
                </ul>
            </div>
            
            <form method="POST" action="/reset-password" id="resetForm">
                <div class="mb-3">
                    <label for="new_password" class="form-label">
                        <i class="bi bi-lock-fill"></i> New Password
                    </label>
                    <input type="password" class="form-control" id="new_password" name="new_password" 
                           placeholder="Enter new password" required autofocus>
                    <div class="password-strength" id="strengthIndicator"></div>
                </div>
                
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">
                        <i class="bi bi-lock-fill"></i> Confirm Password
                    </label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                           placeholder="Re-enter new password" required>
                    <small class="text-muted" id="matchIndicator"></small>
                </div>
                
                <button type="submit" class="btn btn-reset">
                    <i class="bi bi-check-circle-fill"></i> Reset Password
                </button>
            </form>
            
            <div class="back-link">
                <a href="/login"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');
        const strengthIndicator = document.getElementById('strengthIndicator');
        const matchIndicator = document.getElementById('matchIndicator');
        
        // Password strength indicator
        newPassword.addEventListener('input', function() {
            const password = this.value;
            let strength = '';
            let color = '';
            
            if (password.length === 0) {
                strengthIndicator.textContent = '';
                return;
            }
            
            if (password.length < 8) {
                strength = 'Too short (minimum 8 characters)';
                color = 'text-danger';
            } else if (password.length < 12) {
                strength = 'Weak - Consider a longer password';
                color = 'text-warning';
            } else if (password.length < 16) {
                strength = 'Good password strength';
                color = 'text-success';
            } else {
                strength = 'Strong password!';
                color = 'text-success fw-bold';
            }
            
            strengthIndicator.textContent = strength;
            strengthIndicator.className = 'password-strength ' + color;
        });
        
        // Password match indicator
        confirmPassword.addEventListener('input', function() {
            if (this.value === '') {
                matchIndicator.textContent = '';
                return;
            }
            
            if (this.value === newPassword.value) {
                matchIndicator.textContent = '✓ Passwords match';
                matchIndicator.className = 'text-success';
            } else {
                matchIndicator.textContent = '✗ Passwords do not match';
                matchIndicator.className = 'text-danger';
            }
        });
        
        // Form validation
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            if (newPassword.value !== confirmPassword.value) {
                e.preventDefault();
                alert('Passwords do not match!');
                confirmPassword.focus();
            }
            
            if (newPassword.value.length < 8) {
                e.preventDefault();
                alert('Password must be at least 8 characters long!');
                newPassword.focus();
            }
        });
    </script>
</body>
</html>
