[pytest]
# Pytest configuration for the project
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markersonly = true

# Ignore integration tests and scripts that require external setup
norecursedirs = .git .pytest_cache venv __pycache__

# Add options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings

# Mark non-unit test scripts
filterwarnings =
    ignore::DeprecationWarning
