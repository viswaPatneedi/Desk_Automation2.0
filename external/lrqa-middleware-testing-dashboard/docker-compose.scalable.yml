version: '3.8'

services:
  # Redis for distributed locking and session management
  redis:
    image: redis:7-alpine
    container_name: rdk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - rdk-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.scalable
    container_name: rdk-testing-dashboard
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      # JSON data files (all in Json directory)
      - ./Json:/app/Json
      # Persist logs and screenshots
      - ./iteration_logs:/app/iteration_logs
      - ./screenshots:/app/screenshots
      # Mount static assets
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      # Flask configuration
      - FLASK_APP=app.py
      - FLASK_ENV=production
      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      # Email configuration
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      # Application configuration
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      # Scalability settings
      - MAX_WORKERS=8
      - WORKER_CLASS=gevent
    restart: unless-stopped
    networks:
      - rdk-network
    # Resource limits to prevent one container from consuming all resources
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 512M
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for load balancing multiple app instances
  # Uncomment if you need to scale beyond one container
  nginx:
    image: nginx:alpine
    container_name: rdk-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - rdk-network
    restart: unless-stopped

networks:
  rdk-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
