apiVersion: v1
kind: Service
metadata:
  name: rdk-testing-service
  namespace: rdk-testing
  labels:
    app: device-testing-dashboard
spec:
  type: ClusterIP  # Change to LoadBalancer or NodePort for external access
  selector:
    app: device-testing-dashboard
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP
  sessionAffinity: ClientIP  # Sticky sessions for stateful operations
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

