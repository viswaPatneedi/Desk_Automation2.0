apiVersion: v1
kind: Secret
metadata:
  name: rdk-secrets
  namespace: rdk-testing
  labels:
    app: device-testing-dashboard
type: Opaque
stringData:
  # SMTP credentials - CHANGE THESE VALUES!
  SMTP_USERNAME: "your-email@gmail.com"
  SMTP_PASSWORD: "your-app-password"
  SMTP_FROM_EMAIL: "your-email@gmail.com"
  
  # Flask secret key - GENERATE A STRONG SECRET KEY!
  SECRET_KEY: "change-me-to-a-random-secret-key-in-production"
  
  # Optional: Device SSH passwords (if not using key-based auth)
  # Add device-specific secrets as needed
  # DEVICE_DEFAULT_PASSWORD: "your-default-ssh-password"

---
# To create secret from command line instead:
# kubectl create secret generic rdk-secrets \
#   --from-literal=SMTP_USERNAME='your-email@gmail.com' \
#   --from-literal=SMTP_PASSWORD='your-app-password' \
#   --from-literal=SMTP_FROM_EMAIL='your-email@gmail.com' \
#   --from-literal=SECRET_KEY='your-random-secret-key' \
#   -n rdk-testing
